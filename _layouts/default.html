<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% if page.title %}{{ page.title }} · {% endif %}{{ site.title }}</title>
    <meta name="description" content="{{ site.description }}">
    <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">
  </head>
  <body>
    <div class="page-shell">
      <header class="site-header">
        <a class="brand" href="{{ '/' | relative_url }}" aria-label="Mélusine Caillard home">
          <span class="brand-mark">MC</span>
          <span>
            <strong>Mélusine Caillard</strong>
            <small>Research · Foresight · NLP</small>
          </span>
        </a>
        <nav class="site-nav" aria-label="Main navigation">
          <a href="{{ '/' | relative_url }}">About</a>
          <a href="{{ '/publications/' | relative_url }}">Publications</a>
          <a href="{{ '/cv/' | relative_url }}">CV</a>
        </nav>
      </header>

      <main>
        {{ content }}
      </main>

      <footer class="site-footer">
        <span>© {{ 'now' | date: "%Y" }} Mélusine Caillard</span>
        <a href="mailto:melusine.caillard@etu.sorbonne-universite.fr">Get in touch <span aria-hidden="true">↗</span></a>
      </footer>
    </div>
  </body>
</html>
